
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1280 640"
     width="1280" height="640">

<defs>
  <!-- BACKGROUND -->
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#171526"/>
    <stop offset="55%" stop-color="#090914"/>
    <stop offset="100%" stop-color="#020205"/>
  </linearGradient>

  <radialGradient id="purpleGlow">
    <stop offset="0%" stop-color="#6C63FF" stop-opacity=".55"/>
    <stop offset="100%" stop-color="#6C63FF" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="blueGlow">
    <stop offset="0%" stop-color="#398BFF" stop-opacity=".35"/>
    <stop offset="100%" stop-color="#398BFF" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="textGrad">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="100%" stop-color="#C4C0FF"/>
  </linearGradient>

  <linearGradient id="phoneFrame" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#A49BFF"/>
    <stop offset="45%" stop-color="#292541"/>
    <stop offset="100%" stop-color="#6C63FF"/>
  </linearGradient>

  <linearGradient id="editorBg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#171827"/>
    <stop offset="100%" stop-color="#0B0D16"/>
  </linearGradient>

  <linearGradient id="buttonGrad">
    <stop offset="0%" stop-color="#6C63FF"/>
    <stop offset="100%" stop-color="#A05BFF"/>
  </linearGradient>

  <filter id="blur">
    <feGaussianBlur stdDeviation="20"/>
  </filter>

  <filter id="neon">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <clipPath id="phoneScreen">
    <rect x="827" y="103" width="280" height="434" rx="22"/>
  </clipPath>
</defs>

<!-- BACKGROUND -->
<rect width="1280" height="640" fill="url(#bg)"/>

<circle cx="1000" cy="300" r="390" fill="url(#purpleGlow)">
  <animate attributeName="r"
           values="350;440;350"
           dur="8s" repeatCount="indefinite"/>
</circle>

<circle cx="180" cy="80" r="350" fill="url(#blueGlow)">
  <animate attributeName="cx"
           values="140;280;140"
           dur="10s" repeatCount="indefinite"/>
</circle>

<circle cx="1100" cy="560" r="260" fill="url(#purpleGlow)"/>

<!-- PARTICLES -->
<g fill="#D4D0FF">
  <circle cx="80" cy="90" r="1.5">
    <animate attributeName="opacity" values=".1;1;.1"
             dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="240" cy="70" r="1">
