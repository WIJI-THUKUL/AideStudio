<text x="275" y="575"
      font-family="Arial,sans-serif"
      font-size="12" fill="#77738F">
  + Python  •  C/C++  •  TypeScript  •  JSON
</text>

<!-- PHONE SHADOW -->
<ellipse cx="970" cy="570" rx="160" ry="20"
         fill="#6C63FF" opacity=".35" filter="url(#blur)">
  <animate attributeName="rx"
           values="145;165;145"
           dur="5s" repeatCount="indefinite"/>
</ellipse>

<!-- FLOATING SMARTPHONE -->
<g>
  <animateTransform attributeName="transform"
                    type="translate"
                    values="0 8;0 -8;0 8"
                    dur="5s" repeatCount="indefinite"/>

  <!-- PHONE BODY -->
  <rect x="810" y="73" width="310" height="490"
        rx="40" fill="url(#phoneFrame)"
        stroke="#9B91FF" stroke-width="1.5"/>

  <rect x="816" y="79" width="298" height="478"
        rx="36" fill="#080910"
        stroke="#4D477B"/>

  <!-- SPEAKER -->
  <rect x="920" y="87" width="75" height="5"
        rx="3" fill="#39364E"/>

  <!-- SCREEN -->
  <g clip-path="url(#phoneScreen)">

    <rect x="827" y="103" width="280" height="434"
          fill="url(#editorBg)"/>

    <!-- STATUS BAR -->
    <rect x="827" y="103" width="280" height="23"
          fill="#111320"/>

    <text x="841" y="118" font-family="Arial"
          font-size="9" fill="#C5C4D8">9:41</text>

    <circle cx="1063" cy="114" r="2" fill="#70E6A2"/>
    <rect x="1070" y="110" width="19" height="8"
          rx="2" stroke="#AAA6CE" fill="none"/>

    <!-- APP HEADER -->
    <rect x="827" y="126" width="280" height="39"
          fill="#17182A"/>

    <circle cx="844" cy="145" r="9" fill="#6C63FF"/>

    <path d="M840 145 L844 141 L848 145 L844 149 Z"
          fill="#FFFFFF"/>

    <text x="860" y="149"
          font-family="Arial" font-size="13"
          font-weight="bold" fill="#FFFFFF">
      AideStudio
    </text>

    <!-- RUN BUTTON -->
    <rect x="1050" y="135" width="44" height="21"
          rx="7" fill="#246B4D"/>

    <path d="M1065 140 L1065 151 L1074 145 Z"
          fill="#7DF5B1"/>

    <text x="1080" y="149"
          font-family="Arial" font-size="8"
          fill="#B5FFD4">RUN</text>

    <!-- FILE TABS -->
    <rect x="827" y="165" width="280" height="27"
          fill="#202136"/>

    <text x="839" y="182" font-family="Arial"
          font-size="9" fill="#F4A261">index.html</text>

    <text x="909" y="182" font-family="Arial"
          font-size="9" fill="#77778E">style.css</text>

    <text x="973" y="182" font-family="Arial"
          font-size="9" fill="#77778E">Main.java</text>

    <rect x="835" y="188" width="66" height="2"
          fill="#6C63FF"/>

    <!-- EDITOR GUTTER -->
    <rect x="827" y="192" width="29" height="263"
          fill="#111421"/>

    <!-- LINE NUMBERS -->
    <g font-family="monospace" font-size="9"
       fill="#62647C" text-anchor="end">
      <text x="850" y="214">1</text>
      <text x="850" y="232">2</text>
      <text x="850" y="250">3</text>
      <text x="850" y="268">4</text>
      <text x="850" y="286">5</text>
      <text x="850" y="304">6</text>
      <text x="850" y="322">7</text>
      <text x="850" y="340">8</text>
      <text x="850" y="358">9</text>
      <text x="850" y="376">10</text>
      <text x="850" y="394">11</text>
      <text x="850" y="412">12</text>
      <text x="850" y="430">13</text>
    </g>

    <!-- CODE EDITOR -->
    <g font-family="monospace" font-size="10">

      <text x="863" y="214" fill="#C792EA">
        &lt;!DOCTYPE html&gt;
      </text>

      <text x="863" y="232" fill="#89DDFF">
        &lt;html&gt;
      </text>

      <text x="875" y="250" fill="#89DDFF">
        &lt;head&gt;
      </text>

      <text x="887" y="268" fill="#C792EA">
        &lt;title&gt;
      </text>

      <text x="927" y="268" fill="#C3E88D">
        AideStudio
      </text>

      <text x="990" y="268" fill="#C792EA">
        &lt;/title&gt;
      </text>

      <text x="875" y="286" fill="#89DDFF">
        &lt;/head&gt;
      </text>

      <text x="875" y="304" fill="#89DDFF">
        &lt;body&gt;
      </text>

      <text x="887" y="322" fill="#C792EA">
        &lt;h1&gt;
      </text>

      <text x="925" y="322" fill="#C3E88D">
        Hello World!
      </text>

      <text x="1000" y="322" fill="#C792EA">
        &lt;/h1&gt;
      </text>

      <text x="875" y="340" fill="#89DDFF">
        &lt;/body&gt;
      </text>

      <text x="863" y="358" fill="#89DDFF">
        &lt;/html&gt;
      </text>

      <rect x="863" y="371" width="2" height="14"
            fill="#FFFFFF">
        <animate attributeName="opacity"
                 values="1;0;1"
                 dur="1s" repeatCount="indefinite"/>
      </rect>

      <text x="863" y="412" fill="#777B95">
        // Ready to code
      </text>

      <text x="863" y="430" fill="#C3E88D">
        Build your future.
      </text>
    </g>

    <!-- TERMINAL HEADER -->
    <rect x="827" y="455" width="280" height="25"
          fill="#202136"/>

    <text x="841" y="472"
          font-family="monospace"
          font-size="10" fill="#AFA8FF">
      TERMINAL
    </text>

    <circle cx="1090" cy="467" r="3" fill="#55D995"/>

    <!-- TERMINAL -->
    <rect x="827" y="480" width="280" height="57"
          fill="#090D14"/>

    <g font-family="monospace" font-size="9">
      <text x="839" y="498" fill="#72E4A4">
        $ build project
      </text>

      <text x="839" y="514" fill="#A8B2C8">
        Compiling sources...
      </text>

      <text x="839" y="530" fill="#72E4A4">
        Build successful!
      </text>
    </g>

    <!-- PROGRESS BAR -->
    <rect x="1022" y="486" width="68" height="4"
          rx="2" fill="#34334D"/>

    <rect x="1022" y="486" width="68" height="4"
          rx="2" fill="#6C63FF">
      <animate attributeName="width"
               values="5;68;5"
               dur="5s" repeatCount="indefinite"/>
    </rect>

  </g>
</g>

<!-- FLOATING PROJECT CARD -->
<g>
  <animateTransform attributeName="transform"
                    type="translate"
                    values="0 0;0 -12;0 0"
                    dur="4s" repeatCount="indefinite"/>

  <rect x="725" y="210" width="112" height="135"
        rx="12" fill="#201E38"
        stroke="#7065D9"/>

  <text x="738" y="230"
        font-family="Arial" font-size="10"
        font-weight="bold" fill="#FFFFFF">
    PROJECT
  </text>

  <g font-family="monospace" font-size="9">
    <text x="739" y="252" fill="#AFA8FF">▾ app</text>
    <text x="750" y="270" fill="#E8A66B">▸ src</text>
    <text x="750" y="288" fill="#80B9FF">▸ res</text>
    <text x="750" y="306" fill="#C3E88D">▸ assets</text>
    <text x="739" y="329" fill="#B8B6D8">build.gradle</text>
  </g>
</g>

<!-- FLOATING TERMINAL CARD -->
<g>
  <animateTransform attributeName="transform"
                    type="translate"
                    values="0 0;0 10;0 0"
                    dur="4.5s" repeatCount="indefinite"/>

  <rect x="1085" y="355" width="145" height="92"
        rx="12" fill="#17182B"
        stroke="#7167D8"/>

  <text x="1098" y="375"
        font-family="Arial" font-size="10"
        fill="#BEB8FF">
    BUILD STATUS
  </text>

  <circle cx="1104" cy="399" r="5" fill="#55E6A0"
          filter="url(#neon)"/>

  <text x="1116" y="403"
        font-family="Arial" font-size="11"
        fill="#FFFFFF">
    Success
  </text>

  <text x="1098" y="425"
        font-family="monospace" font-size="9"
        fill="#8B91A8">
    0 Errors / 0 Warnings
  </text>
</g>

<!-- FLOATING SPARKLES -->
<g fill="#B9AEFF" filter="url(#neon)">
  <path d="M770 390 L775 405 L790 410 L775 415 L770 430 L765 415 L750 410 L765 405 Z">
    <animateTransform attributeName="transform"
                      type="rotate"
                      values="0 770 410;180 770 410;360 770 410"
                      dur="8s" repeatCount="indefinite"/>
  </path>

  <path d="M1160 180 L1164 192 L1176 196 L1164 200 L1160 212 L1156 200 L1144 196 L1156 192 Z">
    <animate attributeName="opacity"
             values=".2;1;.2"
             dur="2s" repeatCount="indefinite"/>
  </path>
</g>

<!-- BOTTOM LINE -->
<path d="M70 610 Q640 585 1210 610"
      fill="none" stroke="#6C63FF"
      stroke-width="1" opacity=".35"/>

</svg>
      
