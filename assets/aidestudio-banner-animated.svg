  </circle>
  <circle cx="700" cy="80" r="1">
    <animate attributeName="opacity" values=".1;1;.1"
             dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1200" cy="100" r="1.5">
    <animate attributeName="opacity" values=".1;1;.1"
             dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1150" cy="510" r="1.5">
    <animate attributeName="opacity" values=".1;1;.1"
             dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650" cy="550" r="1">
    <animate attributeName="opacity" values=".1;1;.1"
             dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="490" r="1.5">
    <animate attributeName="opacity" values=".1;1;.1"
             dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="520" cy="420" r="1.5">
    <animate attributeName="opacity" values=".1;1;.1"
             dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="300" r="1">
    <animate attributeName="opacity" values=".1;1;.1"
             dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="920" cy="65" r="1.5">
    <animate attributeName="opacity" values=".1;1;.1"
             dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="330" cy="570" r="1">
    <animate attributeName="opacity" values=".1;1;.1"
             dur="3s" repeatCount="indefinite"/>
  </circle>
</g>

